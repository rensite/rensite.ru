<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0C0B">
<title>Moved — rensite.ru → renatgalin.pro</title>
<meta name="description" content="rensite.ru now lives at renatgalin.pro.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://renatgalin.pro/">
<noscript><meta http-equiv="refresh" content="0; url=https://renatgalin.pro/"></noscript>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Заглушка всего rensite.ru: сайт переехал на renatgalin.pro. Эта же страница
   лежит как 404.html, поэтому GitHub Pages отдаёт её на любой старый адрес.
   Отсчёт и переход на тот же путь. localStorage привязан к домену, поэтому
   все ключи сайта едут в хэше #rensite=… — принимает их i18n.js на той стороне. */
:root{
  --bg:#0E0C0B; --ink:#F2EDE6; --soft:#C3B9AC; --mute:#8C8175;
  --red:#D8392B; --amber:#E0A33E; --gold:#F2C766; --rule:#F2EDE62E;
  --display:"Bebas Neue","Oswald",Impact,"Arial Narrow",sans-serif;
  --serif:"Fraunces",Georgia,serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--serif);
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:radial-gradient(70vmax 50vmax at 80% 0%, rgba(216,57,43,.22), transparent 60%), var(--bg)}
a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:3px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px clamp(16px,4vw,40px);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.lang button{appearance:none;background:none;border:0;font:inherit;color:var(--mute);cursor:pointer;padding:2px 3px;letter-spacing:.06em}
.lang button[aria-pressed="true"]{color:var(--ink)}

main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(18px,3vh,30px);
  width:100%;max-width:1040px;margin:0 auto;padding:8px clamp(16px,4vw,40px) 64px}

h1{font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:.86;
  font-size:clamp(56px,11vw,132px);letter-spacing:.005em}
h1 em{font-style:normal;color:var(--amber)}
:lang(ru) h1{letter-spacing:0}

.lede{font-size:clamp(19px,2.2vw,26px);line-height:1.3;max-width:40ch;color:var(--ink)}
.lede a{color:var(--gold);text-decoration-thickness:1px;text-underline-offset:3px}

.act{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.go{appearance:none;cursor:pointer;border:1px solid var(--red);background:var(--red);color:#fff;
  font-family:var(--display);font-size:24px;letter-spacing:.06em;text-transform:uppercase;padding:12px 22px 10px;
  transition:background .15s,color .15s,border-color .15s}
.go:hover{background:#fff;border-color:#fff;color:#8E1D14}
.stay{appearance:none;cursor:pointer;background:none;border:0;border-bottom:1px solid var(--rule);
  font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:4px 0}
.stay:hover{color:var(--ink);border-bottom-color:var(--ink)}
.count{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.count b{display:inline-block;min-width:1.2em;text-align:center;font-family:var(--display);font-weight:400;
  font-size:30px;line-height:1;color:var(--gold);vertical-align:-6px}
.url{font-family:var(--mono);font-size:clamp(14px,1.6vw,17px);color:var(--gold);word-break:break-all;
  text-decoration:none;min-width:0}
.url:hover{color:#fff}
</style>
</head>
<body>
<header class="top">
  <span>rensite.ru</span>
  <span class="lang" role="group" aria-label="Language / Язык"><button type="button" data-l="en">en</button>·<button type="button" data-l="ru">ru</button></span>
</header>

<main>
  <h1 data-t="h1">We moved. <em>Jumped, actually.</em></h1>

  <p class="lede" data-t="lede">rensite.ru now lives at <a class="to" href="https://renatgalin.pro/">renatgalin.pro</a>. Same music guides, notes and projects, same addresses — just a new domain.</p>

  <div class="act">
    <button class="go" id="go" type="button" data-t="go">Go →</button>
    <a class="to url" id="url" href="https://renatgalin.pro/">renatgalin.pro/</a>
  </div>
  <div class="act">
    <span class="count" id="count"><span data-t="in">Redirecting in</span> <b id="sec">6</b></span>
    <button class="stay" id="stay" type="button" data-t="stay">Stay here</button>
  </div>
</main>

<script>
(function(){
  'use strict';
  var ORIGIN = 'https://renatgalin.pro';
  var T = {
    en: {
      h1: 'We moved. <em>Jumped, actually.</em>',
      lede: 'rensite.ru now lives at <a class="to" href="' + ORIGIN + '/">renatgalin.pro</a>. Same music guides, notes and projects, same addresses — just a new domain.',
      go: 'Go →', in: 'Redirecting in', stay: 'Stay here', paused: 'Paused — go when ready',
      title: 'Moved — rensite.ru → renatgalin.pro'
    },
    ru: {
      h1: 'Мы переехали. <em>То есть перепрыгнули.</em>',
      lede: 'rensite.ru теперь живёт на <a class="to" href="' + ORIGIN + '/">renatgalin.pro</a>. Те же музыкальные гиды, заметки и проекты, те же адреса — только домен новый.',
      go: 'Вперёд →', in: 'Переход через', stay: 'Остаться здесь', paused: 'На паузе — переходите, когда будете готовы',
      title: 'Переехали — rensite.ru → renatgalin.pro'
    }
  };

  /* Тот же путь на новом домене. /404.html и /index.html — служебные имена Pages. */
  var path = location.pathname.replace(/(^|\/)(404|index)\.html$/, '$1');
  var TARGET = ORIGIN + path + location.search;
  var anchor = /^#[\w-]+$/.test(location.hash) ? location.hash : '';

  var lang = 'en';
  try { var l = localStorage.getItem('rensite:lang'); if (l === 'ru' || l === 'en') lang = l; } catch (e) {}

  /* Весь localStorage сайта → base64url JSON {ls:{ключ:строка}, a:'#якорь'}.
     Отметки (списки ♥, «прослушано», «смотрел») на той стороне объединяются
     с уже имеющимися, прочие ключи кладутся, только если их там ещё нет. */
  var ls = {}, keys = 0;
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i), v = localStorage.getItem(k);
      if (k === null || v === null || v.length > 50000) continue;
      ls[k] = v; keys++;
    }
  } catch (e) {}
  function destination(){
    if (!keys) return TARGET + anchor;
    var payload = { ls: ls };
    if (anchor) payload.a = anchor;
    var bytes = new TextEncoder().encode(JSON.stringify(payload)), bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return TARGET + '#rensite=' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function $(id){ return document.getElementById(id); }
  var paused = false;
  function paint(){
    var t = T[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(function(el){
      var k = el.getAttribute('data-t'); if (typeof t[k] === 'string') el.innerHTML = t[k];
    });
    if (paused) $('count').textContent = t.paused;
    document.querySelectorAll('.lang button').forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-l') === lang ? 'true' : 'false'); });
    document.querySelectorAll('a.to').forEach(function(a){ a.href = destination(); });
    $('url').textContent = (TARGET + anchor).replace(/^https?:\/\//, '');
    document.title = t.title;
  }
  document.querySelector('.lang').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    lang = b.getAttribute('data-l');
    try { localStorage.setItem('rensite:lang', lang); } catch (e) {}
    ls['rensite:lang'] = lang; keys = Object.keys(ls).length;
    paint();
  });
  paint();

  function go(){ clearInterval(timer); location.href = destination(); }

  var left = 6, timer = setInterval(function(){
    if (paused) return;
    left -= 1; $('sec').textContent = left;
    if (left <= 0) go();
  }, 1000);

  $('go').addEventListener('click', go);
  $('stay').addEventListener('click', function(){
    paused = true; clearInterval(timer);
    $('stay').hidden = true;
    $('count').textContent = T[lang].paused;
  });
})();
</script>
</body>
</html>
